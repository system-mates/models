  - name: log_mode
    log:
      level: INFO
      message: ="Garobox charger mode set to " + activity.mode.value
- name: prices
  activities:
  - name: today
    io:
      via: fetch
      params:
        return: json
        url: https://aktuellaelpriser.se/api.php?format=json&omrade=SE4&typ=idag
  - name: tomorrow
    io:
      via: fetch
      params:
        return: json
        url: https://aktuellaelpriser.se/api.php?format=json&omrade=SE4&typ=imorgon
  - name: combine
    compose: |
      let a = activity.today.value.data.priser.merge(activity.tomorrow.value.data.priser)
      root = $a.map_each(v -> {
        "timestamp": v.timestamp.floor(),
        "price": v.pris_kr_kwh,
      })
  - name: store
    compose: 'root = share_set("prices.2days", activity.combine.value)'

- name: battery_status
  profiles:
  - production
  activities:
  - name: from_car
    io:
      via: fetch
      direction: input
      params:
        return: json
        url: http://server.nessie-owl.ts.net:18080/rest/items/EQA_Battery_Charge_Level
        options:
          method: GET
          headers:
            Accept: application/json
  - name: update_level
    share: output
    compose: 'root = share_set("level",activity.from_car.value.state.string().replace("
      %","").number())'
- name: battery_simulator
  profiles:
  - simulation
  activities:
  - name: update_simulated_battery_level
    state: input
    share: both
    compose: |
      let level = share_get("level")
      let speed = state_get("speed")
      let charger_on = share_get("on")
      let next = if $charger_on {
        [$level + 2*($speed / 60), 100].min()
      } else {
        $level
      }
      root = share_set("level", $next)
