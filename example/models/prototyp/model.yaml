- name: ranking
  activities:
  - name: rank
    compose: |
      let cutoff = timestamp_unix() - 15 * 60
      let prices = share_init("prices.2days", [])
      let recent = $prices.filter(p -> p.timestamp >= $cutoff)
      let target_time = state_init("target.time", 0)
      let eligible = $recent.filter(p -> $target_time > 0 && p.timestamp + 15 * 60 <= $target_time)
      let sorted = $eligible.sort_by(p -> p.timestamp).sort_by(p -> p.price).enumerated()
      root = share_set("ranked",$recent.map_each(p -> {
           "timestamp": p.timestamp.floor(),
           "price": p.price,
           "rank": $sorted.find_by(r -> r.value.timestamp == p.timestamp)
        })
      )
- name: planning
  activities:
  - name: plan
    compose: |
      let bmap = share_get("ranked").fold({}, item -> item.tally.merge({item.value.timestamp.floor().string(): item.value}))
      #let cutoff = timestamp_unix() - 15 * 60
      #let recent = share_get("prices.2days").filter(p -> p.timestamp >= $cutoff)
      let target_time = state_init("target.time", 0)
      let requested_target = state_init("target.level", 100)
      let level = share_init("level", 100)
      let speed = state_init("speed", 10.0)
      let remaining = $requested_target - $level
      let required_intervals = if $target_time > 0 && $remaining > 0 {
        ((60 * $remaining / $speed) / 15).ceil()
      } else {
        0
      }
      let plan = share_get("ranked").map_each(p -> if $bmap.get(p.timestamp.floor().string()) != null {
          p.without("timestamp").merge({
             "rank": $bmap.get(p.timestamp.floor().string()).rank,
             "charge": $bmap.get(p.timestamp.floor().string()).rank >= 0 && $bmap.get(p.timestamp.floor().string()).rank < $required_intervals,
             "timestamp": p.timestamp.floor(),
             "quarter": p.timestamp.ts_format("15:04", "Europe/Stockholm"),
             "end_timestamp": p.timestamp.floor() + 15 * 60,
             "end_time": (p.timestamp + 15 * 60).ts_format("15:04", "Europe/Stockholm")
          })
      } else {
        p
      })
      let plan = share_set("plan",$plan)
      root = share_set("intervals",$required_intervals)
- name: controller
  activities:
  - name: interval_status
    share: input
    compose: |
      let now = timestamp_unix()
      let active = share_get("plan").find_by(slot -> $now >= slot.timestamp && $now < slot.end_timestamp)
      root = share_set("on",$active.charge.or(false))
- name: garobox
#  profiles:
#  - production
  activities:
  - name: mode
    compose: |
        root = if share_get("on") { "ALWAYS_ON" } else { "ALWAYS_OFF" }
