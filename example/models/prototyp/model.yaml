model:
  name: charging
coordinators:
  bootstrap:
  - name: initialize_laddning
    producers:
    - datainit
    - prices
    - ranking
    - planning
  schedules:
  - name: battery_level
    cron: "*/2 * * * *"
    producers:
    - battery_status
    - battery_simulator
  - name: elpriser_update_hourly
    cron: 20 * * * *
    producers:
    - prices
  - name: plan_update_quarterly
    cron: "*/15 * * * *"
    producers:
    - ranking
  - name: execute_plan_each_minute
    cron: "* * * * *"
    producers:
    - controller
  dependencies:
  - name: state_share_dependencies
    dependencies:
    - source:
        share: on
      producers:
      - garobox
    - source:
        state: target.time
      producers:
      - ranking
      - limiter
    - source:
        share: prices.2days
      producers:
      - ranking
    - source:
        share: ranked
      producers:
      - planning
    - source:
        state: target.level
      producers:
      - planning
      - limiter
    - source:
        state: speed
      producers:
      - planning
producers:
