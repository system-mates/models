model:
  name: nisse


coordinators:
  bootstrap:
  - name: initialize_nisse
    producers:
    - initialize_nisse

  schedules:
  - name: each_hour
    cron: "0 * * * *"
    producers:
    - fetch_prices
  - name: each_quarter
    cron: "*/15 * * * *"
    producers:
    - rank
  - name: each_minute
    cron: "* * * * *"
    producers:
    - control
    - car_status

  routes:
  - name: nisse_set_target_time
    method: POST
    path: /target/time
    authorization: {mode: public}
    producers:
    - nisse_set_target_time
  - name: set_target_level
    method: POST
    path: /target/level
    authorization: {mode: public}
    producers:
    - set_target_level

  dependencies:
  - name: ranked_updates_plan
    dependencies:
    - source: {share: ranked}
      producers: [plan]
  - name: charger_mode_updates_garobox
    dependencies:
    - source: {share: on}
      producers: [nisse_garobox]
  - name: target_time_updates_architecture
    dependencies:
    - source: {state: target.time}
      producers: [rank, limit_target_level]
  - name: target_level_updates_architecture
    dependencies:
    - source: {state: target.level}
      producers: [limit_target_level, remaining_charge_time]

producers:
- name: initialize_nisse
  activities:
  - name: initialize_resources
    compose: |
      root.prices = share_init("prices", [])
      root.ranked = share_init("ranked", [])
      root.plan = share_init("plan", [])
      root.on = share_init("on", false)
      root.level = share_init("level", 50.0)
      root.charge_time = share_init("charge.time", 0.0)
      root.target_time = state_init("target.time", timestamp_unix() + 8 * 60 * 60)
      root.target_level = state_init("target.level", 80.0)
      root.speed = state_init("speed", 10.0)

- name: fetch_prices
  activities:
  - name: fetch
    io:
      via: fetch
      direction: input
      params:
        return: json
        url: https://aktuellaelpriser.se/api.php?format=json&omrade=SE4&typ=idag
  - name: store
    compose: root = share_set("prices", activity.fetch.value)

- name: rank
  activities:
  - name: rank_prices
    compose: |
      let prices = share_get("prices")
      let target_time = state_get("target.time")
      root = share_set("ranked", {"prices": $prices, "target_time": $target_time})

- name: plan
  activities:
  - name: create_plan
    compose: |
      let ranked_prices = share_get("ranked")
      root = share_set("plan", $ranked_prices)

- name: control
  activities:
  - name: choose_charger_mode
    compose: |
      let charging_plan = share_get("plan")
      root = share_set("on", charging_plan != null)

- name: nisse_garobox
  profiles: [production]
  activities:
  - name: apply_mode
    io:
      via: fetch
      direction: output
      params:
        return: response
        url: http://charge-box/rest/charge/mode
        options:
          method: POST
          headers: {Content-Type: application/json}
        body: '=if share_get("on") { "ON" } else { "OFF" }'

- name: car_status
  profiles: [production]
  activities:
  - name: fetch_from_mercedes
    io:
      via: fetch
      direction: input
      params:
        return: json
        url: https://mercedes/vehicle/status
  - name: store_level
    compose: root = share_set("level", activity.fetch_from_mercedes.value.level.or(50.0))

- name: remaining_charge_time
  activities:
  - name: calculate
    compose: |
      let target_level = state_get("target.level")
      let level = share_get("level")
      let speed = state_get("speed")
      root = share_set("charge.time", [($target_level - $level) / $speed, 0].max())

- name: limit_target_level
  activities:
  - name: limit
    compose: |
      let target_time = state_get("target.time")
      let target_level = state_get("target.level")
      let charge_time = share_get("charge.time")
      let limited = if timestamp_unix() + $charge_time * 60 * 60 > $target_time { 80.0 } else { $target_level }
      root = state_set("target.level", $limited)

- name: nisse_set_target_time
  activities:
  - name: set
    compose: root = state_set("target.time", params.target_time.number())

- name: set_target_level
  activities:
  - name: set
    compose: root = state_set("target.level", params.target_level.number())
